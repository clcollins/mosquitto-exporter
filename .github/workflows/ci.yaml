name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CI_IMAGE: mosquitto-exporter-ci
  IMAGE_NAME: quay.io/clcollins/mosquitto-exporter

jobs:
  ci-image:
    name: Build CI Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build CI container
        run: podman build -f test/Containerfile.ci -t ${{ env.CI_IMAGE }} test/
      - name: Save CI container image
        run: podman save ${{ env.CI_IMAGE }} -o /tmp/${{ env.CI_IMAGE }}.tar
      - name: Upload CI container image
        uses: actions/upload-artifact@v4
        with:
          name: ci-image
          path: /tmp/${{ env.CI_IMAGE }}.tar
          retention-days: 1

  yaml-lint:
    name: YAML Lint
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${{ env.CI_IMAGE }}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${{ env.CI_IMAGE }} make yaml-lint

  markdown-lint:
    name: Markdown Lint
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${{ env.CI_IMAGE }}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${{ env.CI_IMAGE }} make markdown-lint

  makefile-lint:
    name: Makefile Lint
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${{ env.CI_IMAGE }}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${{ env.CI_IMAGE }} make makefile-lint

  containerfile-check:
    name: Containerfile Check
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${{ env.CI_IMAGE }}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${{ env.CI_IMAGE }} make containerfile-check

  shellcheck-lint:
    name: ShellCheck
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${{ env.CI_IMAGE }}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${{ env.CI_IMAGE }} make shellcheck-lint

  docs-check:
    name: Documentation Check
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${{ env.CI_IMAGE }}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${{ env.CI_IMAGE }} make docs-check

  fmt:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v -count=1 -race ./...

  tidy-check:
    name: Go Mod Tidy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy."
            git diff go.mod go.sum
            exit 1
          fi


  image-build:
    name: Container Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build container image
        run: |
          podman build -f Containerfile \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg VCS_REF=$(git rev-parse HEAD) \
            --build-arg VERSION=ci \
            -t ${{ env.IMAGE_NAME }}:ci .
      - name: Validate OCI labels
        run: |
          podman inspect ${{ env.IMAGE_NAME }}:ci --format '{{index .Config.Labels "org.opencontainers.image.title"}}' | grep -q "mosquitto-exporter"
          echo "OCI labels validated."
